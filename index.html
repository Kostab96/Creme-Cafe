    if (fuori.length) openNc({
      tipo: NC_TIPI[1],
      descrizione: fuori.join("; ")
    });
  },
  "temp-del": async b => {
    if (await ask("Eliminare la rilevazione?", "La temperatura sparisce dallo storico e dai report.", "Elimina", true)) await del("temperature", b.dataset.id);
  },
  "new-task": () => openTask(),
  "edit-task": b => openTask(S.attivita.find((t => t.id === b.dataset.id))),
  tab: b => {
    UI[b.dataset.g].tab = b.dataset.tab;
    refresh();
  },
  "pul-done": async b => {
    const t = S.attivita.find((x => x.id === b.dataset.id));
    if (!t) return;
    await put("registro", newId(), {
      attivitaId: t.id,
      area: t.area || "",
      attivita: t.attivita || "",
      frequenza: t.frequenza || "giornaliera",
      data: b.dataset.day || today(),
      ora: nowHM(),
      operatore: (UI.op || "").trim()
    });
  },
  "pul-undo": b => del("registro", b.dataset.id),
  "seed-tasks": async () => {
    for (const [area, attivita, frequenza] of SEED) await put("attivita", newId(), {
      area: area,
      attivita: attivita,
      frequenza: frequenza,
      prodotto: ""
    });
    toast("Schede create: modificale come ti serve.");
  },
  "new-nc": () => openNc(),
  "edit-nc": b => openNc(S.nc.find((n => n.id === b.dataset.id))),
  "nc-toggle": b => {
    const n = S.nc.find((x => x.id === b.dataset.id));
    if (n) put("nc", n.id, {
      ...n,
      stato: n.stato === "risolta" ? "aperta" : "risolta"
    });
  },
  sell: b => sell(b.dataset.id, 1),
  unsell: b => sell(b.dataset.id, -1),
  "cas-cat": b => {
    UI.cas.cat = b.dataset.cat;
    refresh();
  },
  "new-prod": () => openProd(),
  "edit-prod": b => openProd(S.prodotti.find((p => p.id === b.dataset.id))),
  "add-ing": () => {
    P.ingredienti.push({
      codice: "",
      dose: "",
      um: "pz"
    });
    renderIng();
  },
  "rm-ing": b => {
    P.ingredienti.splice(+b.closest(".ing").dataset.i, 1);
    if (!P.ingredienti.length) P.ingredienti.push({
      codice: "",
      dose: "",
      um: "pz"
    });
    renderIng();
  },
  "dup-prod": () => saveProd(true),
  "del-prod": async () => {
    if (!await ask("Eliminare il prodotto dal listino?", "Le vendite già registrate restano nello storico.", "Elimina", true)) return;
    await del("prodotti", P.id);
    closeDlg(dlg);
  },
  theme: b => {
    THEME = b.dataset.v || {
      auto: "light",
      light: "dark",
      dark: "auto"
    }[THEME];
    lsSet("haccp_theme", THEME);
    applyTheme();
    refresh();
    toast({
      auto: "Tema automatico: chiaro di giorno, scuro dalle 19 alle 7.",
      light: "Tema chiaro.",
      dark: "Tema scuro."
    }[THEME]);
  },
  sede: b => {
    if (b.dataset.id === CUR) return;
    CUR = b.dataset.id;
    lsSet("haccp_sede", CUR);
    reindex();
    applyBrand();
    route();
  },
  pdf: () => {
    try {
      makePdf();
    } catch (e) {
      console.error(e);
      toast("Creazione del PDF non riuscita.", true);
    }
  },
  backup: () => download("backup-haccp_" + today() + ".json", JSON.stringify(DB, null, 1), "application/json"),
  "sync-now": async () => {
    dirty = true;
    toast(await sync() ? "Dati sincronizzati con Google Drive." : "Sincronizzazione non riuscita: riprova.", false);
    refresh();
  },
  "g-connect": async () => {
    try {
      await gConnect(!CFG.granted);
      setSync();
      lastErrMsg = "";
      const ok = await sync();
      refresh();
      toast(ok ? "Google Drive collegato." : "Google Drive non risponde" + (lastErrMsg ? ": " + lastErrMsg : "."), !ok);
    } catch (e) {
      toast(e.message || "Accesso a Google non riuscito.", true);
    }
  },
  "g-off": async () => {
    if (!await ask("Scollegare Google Drive?", "I dati restano nel tuo Drive e su questo dispositivo, ma le modifiche fatte qui non verranno più sincronizzate.", "Scollega", true)) return;
    G.token = "";
    lsSet("haccp_tok", "");
    CFG.mode = "local";
    CFG.fileId = "";
    CFG.folderId = "";
    saveCfg();
    setSync();
    refresh();
  },
  "g-setup": () => {
    CFG.mode = "";
    saveCfg();
    $("#app").hidden = true;
    boot();
  },
  logout: async () => {
    if (!await ask("Uscire dall’app?", "Per rientrare serviranno di nuovo nome utente e password. I dati restano salvati.", "Esci")) return;
    CFG.authed = "";
    saveCfg();
    if (dirty && CFG.mode === "drive" && tokenOk()) await sync();
    closeDlg(dlg);
    closeDlg(dlg2);
    $("#app").hidden = true;
    $("#gate").innerHTML = "";
    try {
      history.replaceState(null, "", location.pathname + location.search);
    } catch {}
    location.reload();
  }
};

document.addEventListener("click", (e => {
  const b = e.target.closest("[data-act]");
  if (b && ACT[b.dataset.act]) {
    Promise.resolve(ACT[b.dataset.act](b, e)).catch(saveErr);
    return;
  }
  const nb = e.target.closest("#navBtn"), menu = $("#navMenu");
  if (nb) {
    const open = menu.hidden;
    menu.hidden = !open;
    nb.setAttribute("aria-expanded", open);
    return;
  }
  const a = e.target.closest("#navMenu a");
  if (a) {
    e.preventDefault();
    go(a.getAttribute("href").slice(1));
  }
  if (menu && !menu.hidden) {
    menu.hidden = true;
    $("#navBtn").setAttribute("aria-expanded", "false");
  }
}));

document.addEventListener("keydown", (e => {
  if (e.key === "Escape" && !$("#navMenu").hidden) {
    $("#navMenu").hidden = true;
    $("#navBtn").setAttribute("aria-expanded", "false");
    $("#navBtn").focus();
  }
}));

function onFilter(e) {
  const el = e.target.closest("[data-f]");
  if (!el) return;
  const [a, b] = el.dataset.f.split(".");
  if (b) UI[a][b] = el.value; else {
    UI[a] = el.value;
    lsSet("haccp_op", el.value);
  }
  refresh();
}

$("#view").addEventListener("input", onFilter);

$("#view").addEventListener("change", onFilter);

const LABEL = {
  scadenziario: "Scadenziario",
  cassa: "Cassa",
  dashboard: "Dashboard",
  temperature: "Temperature",
  pulizie: "Pulizie",
  nonconformita: "Non conformità",
  carichi: "Carichi",
  scarichi: "Scarichi",
  magazzino: "Magazzino",
  fornitori: "Fornitori",
  report: "Report PDF",
  impostazioni: "Impostazioni"
};

let current = null, raf = 0;

function route() {
  if ($("#app").hidden) return;
  let name = location.hash.slice(1);
  if (!V[name] || !isBar() && [ "temperature", "pulizie", "nonconformita", "cassa" ].includes(name)) name = "dashboard";
  current = V[name];
  $("#navLabel").textContent = LABEL[name];
  $$("#navMenu a").forEach((a => a.getAttribute("href") === "#" + name ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current")));
  const el = $("#view");
  current.mount(el);
  syncControls(el);
  current.update();
  window.scrollTo(0, 0);
}

function go(name) {
  if (location.hash === "#" + name) route(); else location.hash = name;
}

function refresh() {
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame((() => {
    if (!current || $("#app").hidden) return;
    syncControls($("#view"));
    current.update();
  }));
}

window.addEventListener("hashchange", route);

const ICO = {
  sb: '<path d="M4 8h13v5a5 5 0 01-5 5H9a5 5 0 01-5-5z"/><path d="M17 9h1.5a2.5 2.5 0 010 5H17"/><path d="M8 3v2M12 3v2"/>',
  cal: '<rect x="2.5" y="5" width="19" height="14" rx="7"/><path d="M12 5v14"/><circle cx="12" cy="12" r="2.5"/>',
  stock: '<path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',
  light: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  dark: '<path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/>',
  auto: '<circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 010 16z" fill="currentColor"/>'
};

const svg = (k, n = 18) => `<svg viewBox="0 0 24 24" width="${n}" height="${n}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICO[k]}</svg>`;

let THEME = [ "light", "dark" ].includes(lsGet("haccp_theme")) ? lsGet("haccp_theme") : "auto";

function applyTheme() {
  const h = (new Date).getHours(), t = THEME === "auto" ? h >= 7 && h < 19 ? "light" : "dark" : THEME;
  document.documentElement.dataset.theme = t;
  const b = $("#themeBtn");
  if (b) {
    b.innerHTML = svg(THEME, 20);
    const l = {
      auto: "Tema automatico: chiaro di giorno, scuro di sera",
      light: "Tema chiaro",
      dark: "Tema scuro"
    }[THEME];
    b.title = l;
    b.setAttribute("aria-label", l + ". Tocca per cambiare");
  }
}

function applyBrand() {
  document.documentElement.dataset.sede = CUR;
  document.title = sedeNome(CUR) + " · Café Crème";
  $("#sedi").innerHTML = SEDE_IDS.map((id => `<button type="button" role="tab" data-act="sede" data-id="${id}" aria-selected="${id === CUR}" style="--sc:${SEDI_DEF[id].c}" title="${esc(sedeNome(id))}">${svg(id)}<span>${esc(sedeShort(id))}</span></button>`)).join("");
  $$("#navMenu [data-bar]").forEach((a => a.hidden = !isBar()));
}

const gate = $("#gate");

function showGate(html) {
  $("#app").hidden = true;
  gate.hidden = false;
  gate.innerHTML = `<div class="gate"><img src="${$("#logo").src}" alt="Café Crème" style="height:56px;width:auto;align-self:flex-start">${html}</div>`;
}

function gateSetup() {
  const local = location.protocol === "file:";
  showGate(`<span class="eyebrow">Registro HACCP · Bar</span><h1>Dove salvo i dati?</h1>\n    <p>Con Google Drive i dati e le foto delle bolle stanno nel tuo account Google e li ritrovi su telefono, tablet e PC.</p>\n    ${local ? '<p class="note warn">Hai aperto il file direttamente dal computer: da qui Google Drive non funziona. Apri l’app dal suo indirizzo online (GitHub Pages), oppure prova qui senza Google: i dati resteranno solo in questo browser.</p>' : ""}\n    ${local || GOOGLE_CLIENT_ID ? "" : `<label class="fl">Client ID di Google<input id="gCid" placeholder="xxxxxxxx.apps.googleusercontent.com" value="${esc(CFG.clientId)}" autocapitalize="none" autocomplete="off"></label><p class="note">Si crea una volta sola, gratis, seguendo il file README: poi puoi incollarlo nel codice per non riscriverlo.</p>`}\n    ${local ? "" : '<button class="btn primary" type="button" id="gUse">Usa Google Drive</button>'}\n    <button class="btn${local ? " primary" : ""}" type="button" id="gLocal">Prova senza Google, solo su questo dispositivo</button>`);
  if ($("#gUse")) $("#gUse").onclick = () => {
    const c = GOOGLE_CLIENT_ID || $("#gCid").value.trim();
    if (!/\.apps\.googleusercontent\.com$/.test(c)) {
      toast("Incolla un Client ID valido: finisce con .apps.googleusercontent.com", true);
      return;
    }
    CFG.clientId = GOOGLE_CLIENT_ID ? "" : c;
    CFG.mode = "drive";
    saveCfg();
    boot();
  };
  $("#gLocal").onclick = () => {
    CFG.mode = "local";
    saveCfg();
    boot();
  };
}

function gateGoogle() {
  gisReady().catch((() => {}));
  showGate(`<span class="eyebrow">Registro HACCP · Bar</span><h1>Collega Google Drive</h1>\n    <p>Accedi con l’account Google del bar. L’app vede solo i file che crea lei: una cartella “${esc(DRIVE_FOLDER)}” con i dati e gli allegati.</p>\n    ${location.protocol === "file:" ? '<p class="note warn">Hai aperto il file dal computer: l’accesso a Google funziona solo dall’indirizzo online dell’app.</p>' : ""}\n    <button class="btn primary" type="button" id="gGo">Accedi con Google</button>\n    <button class="btn" type="button" id="gGoRedir">Accedi nella stessa scheda (iPhone / Incognito)</button>\n    <button class="link" type="button" id="gBack">Cambia impostazione</button>`);
  const reset = () => {
    const b = $("#gGo");
    if (b) {
      b.disabled = false;
      b.textContent = "Accedi con Google";
    }
  };
  $("#gGo").onclick = async () => {
    const b = $("#gGo");
    b.disabled = true;
    b.textContent = "Collego…";
    try {
      await gConnect(!CFG.granted);
    } catch (e) {
      toast(e.message || "Accesso a Google non riuscito.", true);
      reset();
      return;
    }
    lastErrMsg = "";
    const ok = await sync();
    if (!ok && !tokenOk()) {
      toast("Google Drive non risponde" + (lastErrMsg ? ": " + lastErrMsg : "."), true);
      reset();
      return;
    }
    if (!ok && lastErrMsg) toast("Attenzione, Google Drive: " + lastErrMsg, true);
    boot(true);
  };
  $("#gGoRedir").onclick = () => gConnectRedirect(false);
  $("#gBack").onclick = () => {
    CFG.mode = "";
    saveCfg();
    boot();
  };
}

function gateLogin() {
  showGate(`<span class="eyebrow">Registro HACCP · Bar</span><h1>Accedi</h1>\n    <form id="lForm" style="display:flex;flex-direction:column;gap:12px"><label class="fl">Nome utente<input id="lUser" autocomplete="username" autocapitalize="none" required></label>\n    <label class="fl">Password<input id="lPass" type="password" autocomplete="current-password" required></label>\n    <button class="btn primary" type="submit">Entra</button></form>`);
  $("#lForm").onsubmit = async e => {
    e.preventDefault();
    const h = await credHash($("#lUser").value, $("#lPass").value), want = DB.settings.passHash || await credHash(DEFAULT_USER, DEFAULT_PASS);
    if (h === want && key($("#lUser").value) === key(DB.settings.user || DEFAULT_USER)) {
      CFG.authed = want;
      saveCfg();
      boot(true);
    } else {
      toast("Nome utente o password non corretti.", true);
      $("#lPass").value = "";
      $("#lPass").focus();
    }
  };
  $("#lUser").focus();
}

let started = false;

async function boot(skipSync) {
  if (!CFG.mode) return gateSetup();
  if (CFG.mode === "drive") {
    gisReady().catch((() => {}));
    if (!tokenOk() && !CFG.fileId && location.protocol !== "file:") return gateGoogle();
    if (location.protocol === "file:" && !CFG.fileId) {
      CFG.mode = "local";
      saveCfg();
    }
    if (tokenOk() && !skipSync && !G.version) await sync();
  }
  const want = DB.settings.passHash || await credHash(DEFAULT_USER, DEFAULT_PASS);
  if (CFG.authed !== want) return gateLogin();
  gate.hidden = true;
  gate.innerHTML = "";
  $("#app").hidden = false;
  applyBrand();
  setSync();
  route();
  if (!started) {
    started = true;
    setInterval((() => {
      if (document.visibilityState === "visible" && !$("#app").hidden) sync();
    }), 45e3);
    document.addEventListener("visibilitychange", (() => {
      if (document.visibilityState === "visible") sync();
    }));
    window.addEventListener("online", (() => sync()));
  }
  if (CFG.mode === "drive" && dirty) scheduleSync(300);
}

applyTheme();

setInterval(applyTheme, 6e4);

loadLocal();

consumeRedirectToken();

boot();
/* — Kosta — */
</script>
